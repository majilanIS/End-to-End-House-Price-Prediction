name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - "frontend_house_prediction/**"
      - ".github/workflows/frontend-vercel.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_house_prediction

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_house_prediction/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend_house_prediction
          vercel-args: "--prod"
