<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>House Price Predictor</title>
    <script>
      // Apply the active theme before the first paint so there is no flash of
      // the wrong colour scheme. 'light'/'dark' override the OS; otherwise we
      // follow prefers-color-scheme. The value is also saved so React can pick
      // up where we left off.
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]')
        var apply = function (theme) {
          document.documentElement.dataset.theme = theme
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0d1117' : '#f5f7fa')
        }
        var saved = localStorage.getItem('theme')
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        apply(theme)
        localStorage.setItem('theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
